    api_key: "${WATI_API_KEY}"
    whatsapp_number: "+60123456789"
  
  api:
    base_url: "https://serverX.wati.io/api/v1"  # X = your server number
    send_url: "https://serverX.wati.io/api/v1/sendTemplateMessage"
    timeout_seconds: 30
    retry_attempts: 3
    retry_backoff_seconds: 5
  
  rate_limits:
    messages_per_minute: 100
    messages_per_day: 10000
    burst_limit: 50
  
  features:
    templates: true
    media_messages: true
    interactive_buttons: true
    list_messages: false
    shared_inbox: true
    no_code_chatbot: true
    crm_integrations: true
    team_collaboration: true
  
  webhook:
    enabled: true
    url: "https://your-domain.com/webhooks/wati"
    events:
      - "message_sent"
      - "message_delivered"
      - "message_read"
      - "inbound_message"
    signature_validation: true
  
  pricing:
    starter_plan_monthly: 49  # USD (up to 10K conversations)
    growth_plan_monthly: 149  # USD (up to 50K conversations)
    service_fee_per_message: 0.00  # Included in plan
    meta_fees_applied: true
    currency: "USD"
  
  support:

# =============================================================================
# FALLBACK CONFIGURATION
# =============================================================================
# Used when primary provider fails or reaches rate limit
# =============================================================================

fallback:
  enabled: true
  strategy: "automatic"  # Options: automatic, manual
  
  triggers:
    - "primary_rate_limit_exceeded"
    - "primary_api_error_5xx"
    - "primary_quality_rating_low"
  
  notification:
    enabled: true
    channels: ["slack", "email"]
    threshold: "3_failures_in_5_minutes"
  
  failback:
    automatic: true
    delay_minutes: 30
    health_check_interval_minutes: 5

# =============================================================================
# MULTI-PROVIDER LOAD BALANCING
# =============================================================================
# Distribute traffic across multiple providers for redundancy
# =============================================================================

load_balancing:
  enabled: false
  strategy: "weighted_round_robin"  # Options: round_robin, weighted, priority
  
  weights:
    twilio: 50
    gupshup: 30
    messente: 20
  
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 10
    unhealthy_threshold: 3

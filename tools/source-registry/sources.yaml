## Tier 3: Social/Unverified (Use with Caution)

### Twitter/X Political Accounts
- **Accounts:** Party leaders, ADUN, analysts
- **Weight:** 0.3
- **Note:** Must be cross-referenced with Tier 0–2 before use

### Telegram Channels
- **Channels:** Political news aggregators
- **Weight:** 0.3
- **Note:** High risk of misinformation

### Facebook Pages
- **Pages:** Party official pages, candidate pages
- **Weight:** 0.3
- **Note:** Official party pages = 0.5, unofficial = 0.3


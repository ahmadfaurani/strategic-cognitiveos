## Tier 4: Internal Memory (Derived, Not Primary)

### MEMORY.md
- **Location:** `memory/MEMORY.md`
- **Data:** War room briefs, signal registry, historical analysis
- **Weight:** 0.5
- **Note:** Derived from primary sources; must refresh against Tier 0–1 periodically

### Signal Registry
- **Location:** `memory/signals/`
- **Data:** Daily collected signals, PIR-tagged
- **Weight:** 0.5
- **Note:** Aggregated from external sources; verify against originals

---
## Verification Rules

1. **Tier 1 Claims (Factual):** Require ≥2 sources from Tier 0–2, with at least one Tier 0–1
2. **Tier 2 Claims (Analytical):** Require ≥1 Tier 1–2 source + explicit reasoning
3. **Tier 3 Claims (Predictive):** Flag as SPECULATION: or SCENARIO: regardless of source
4. **Conflicting Sources:** If Tier 0 conflicts with Tier 1, prefer Tier 0. If Tier 1 vs Tier 1, flag [CONFLICTING]
5. **Stale Data:** Any claim >30 days old must be re-verified or tagged [STALE]

---
## Source Quality Tracking

Track source accuracy over time:
- False positives (incorrect claims published)
- Corrections issued
- Retractions

Adjust weights quarterly based on track record.

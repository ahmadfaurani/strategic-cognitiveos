# Source Registry — Johor PRN 2026
# Tier hierarchy: 0 (Official) > 1 (Established Media) > 2 (Secondary) > 3 (Social/Unverified)
# Used for multi-source verification and Confidence Assertion

---
## Tier 0: Official Primary Sources

### SPR (Suruhanjaya Pilihan Raya)
- **URL:** https://www.spr.gov.my
- **Data:** Election results, voter demographics, constituency boundaries
- **Update frequency:** During election period only
- **API:** None (manual scrape or official PDF)
- **Weight:** 1.0
- **Fetch script:** `fetch-spr.sh`

### Official Candidate Lists
- **URL:** SPR nomination centre announcements
- **Data:** Candidate names, parties, constituencies
- **Update frequency:** Nomination day + any withdrawals
- **Weight:** 1.0


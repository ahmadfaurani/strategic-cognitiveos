# Controlled Tagging Taxonomy
# Strategic CognitiveOS — Phase 1
# All tags use lowercase kebab-case. No uncontrolled tags without updating this file.

namespaces:
  mission:
    description: "Strategic mission supported"
    values:
      - sovereign-ai
      - national-cybersecurity
      - intelligence-enablement
      - government-ai-adoption
      - productisation
      - institutional-partnerships
      - commercial-growth
      - organisational-capability
      - strategic-communications
      - asean-ecosystem

  domain:
    description: "Knowledge or operating domain"
    values:
      - cybersecurity
      - artificial-intelligence
      - intelligence
      - governance
      - product-management
      - commercial-strategy
      - stakeholder-engagement
      - knowledge-management
      - decision-intelligence
      - risk-management
      - compliance
      - data-infrastructure
      - political-strategy
      - organisational-design

  project:
    description: "Project or programme identifier"
    pattern: "project/<slug>"
    note: "Values are defined per-project as initiatives are registered"

  product:
    description: "Product or platform identifier"
    pattern: "product/<slug>"
    note: "Values are defined per-product as products are registered"

  organisation:
    description: "Organisation or institution"
    pattern: "organisation/<slug>"
    note: "Values are defined as stakeholders are registered"

  person:
    description: "Named individual"
    pattern: "person/<slug>"
    note: "Values are defined as stakeholders are registered"

  stakeholder-type:

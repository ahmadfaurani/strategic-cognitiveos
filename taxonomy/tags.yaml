#     tier-3-watchlist; readiness: proposition, scaled)
#   - All namespaces expanded to absorb values already in active use (Learning 3)
#   - New namespaces: role, type, channel, mechanism, framework, outcome, cognitive-doctrine,
#     meeting, application, cluster, deadline, doctrine, cognitive-loop, method
#   - stakeholder_type expanded to match schema + taxonomy
#   - risk namespace expanded to match schema + taxonomy + practice

  version: 1
  created: '2026-09-08'
  methodology: P0-TAX-01 — single canonical vocabulary source (ASSESS-20260908-001, Athena deliberation round 2)
  rule: Vocabulary changes are made HERE, never in generated targets; generator propagates and pre-commit --check blocks drift
  generated_targets:
  - taxonomy/tags.yaml
  - schemas enum fields bound in bindings
  bindings:
  - 'tags.yaml: all namespace values + patterns'
  - 'schemas/*.schema.json: status (per-type), priority, sensitivity'
  - 'schemas/initiative.schema.json: readiness_level, portfolio_tier'
